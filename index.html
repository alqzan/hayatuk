  <title>حياتك — كل حياتك في مكان واحد</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b10;
      --surface: #0d141d;
      --surface-2: #121b26;
      --surface-3: #172330;
      --line: rgba(255,255,255,.085);
      --line-strong: rgba(255,255,255,.14);
      --text: #f7f3e9;
      --muted: #9ba7b5;
      --soft: #6f7d8e;
      --gold: #e9c97c;
      --gold-deep: #7b5f2d;
      --mint: #63dbb5;
      --mint-deep: #163f37;
      --violet: #b6a4ff;
      --violet-deep: #2e2952;
      --blue: #83b8ff;
      --blue-deep: #1a3150;
      --rose: #ff9da8;
      --rose-deep: #4a222c;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 17px;
      --shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 4%, rgba(86, 111, 180, .2), transparent 28rem),
        radial-gradient(circle at 96% 42%, rgba(31, 115, 91, .16), transparent 26rem),
        #05080c;
      color: var(--text);
      font-family: "SF Arabic", "Geeza Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: .7;
    }
    .ambient::before, .ambient::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(110px);
    }
    .ambient::before { inset: -180px auto auto -120px; background: rgba(123, 102, 225, .18); }
    .ambient::after { inset: auto -180px 6% auto; background: rgba(52, 196, 150, .13); }

    .app {
      position: relative;
      width: min(100%, 480px);
      min-height: 100dvh;
      margin-inline: auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), transparent 26rem),
        var(--bg);
      border-inline: 1px solid rgba(255,255,255,.035);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: calc(12px + env(safe-area-inset-top)) 20px 10px;
      background: linear-gradient(180deg, rgba(7,11,16,.98) 70%, rgba(7,11,16,.86));
      backdrop-filter: blur(20px) saturate(140%);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 13px 13px 13px 5px;
      color: #10130e;
      background: linear-gradient(145deg, #f4dda2, #9bd8b7);
      box-shadow: 0 8px 28px rgba(99,219,181,.18);
      font-size: 19px;
      font-weight: 850;
    }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .brand-copy span { display: block; margin-top: 1px; color: var(--soft); font-size: 10px; }

    .round-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }
    .round-button .unread {
      position: absolute;
      inset: 6px 6px auto auto;
      width: 7px;
      height: 7px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--rose);
    }

    main { padding: 8px 16px calc(110px + env(safe-area-inset-bottom)); }
    .screen { animation: screenIn .28s ease both; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(7px); } }

    .eyebrow { margin: 0 0 5px; color: var(--mint); font-size: 11px; font-weight: 750; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    h1 { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: -.035em; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    h3 { margin: 0; font-size: 15px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .tiny { color: var(--soft); font-size: 11px; }

    .hero-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 14px 4px 20px; }
    .date-line { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .streak {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid rgba(233,201,124,.18);
      border-radius: 999px;
      color: #f3db9d;
      background: rgba(233,201,124,.07);
      font-size: 11px;
      font-weight: 720;
    }

    .balance-card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 190px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.105);
      border-radius: 30px;
      background:
        radial-gradient(circle at 0 0, rgba(182,164,255,.19), transparent 42%),
        radial-gradient(circle at 100% 100%, rgba(99,219,181,.18), transparent 43%),
        linear-gradient(145deg, #141d2a, #0d151e 68%);
      box-shadow: 0 18px 50px rgba(0,0,0,.3);
    }
    .balance-card::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      inset: -90px auto auto 28%;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }
    .balance-copy { position: relative; z-index: 1; }
    .balance-copy .label { color: #c6d1dd; font-size: 12px; }
    .balance-copy h2 { margin-top: 8px; font-size: 24px; line-height: 1.35; }
    .balance-copy p { margin-top: 9px; max-width: 220px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .balance-details { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .micro-chip { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.035); color: #c7d0da; font-size: 10px; }

    .ring {
      --value: 72;
      --ring-color: var(--mint);
      position: relative;
      display: grid;
      place-items: center;
      width: 103px;
      height: 103px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--ring-color) calc(var(--value) * 1%), rgba(255,255,255,.08) 0);
      box-shadow: 0 0 34px rgba(99,219,181,.12);
    }
    .ring::before { content: ""; width: 80px; height: 80px; border-radius: 50%; background: #111a24; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
    .ring-copy { position: absolute; text-align: center; }
    .ring-copy strong { display: block; font-size: 25px; line-height: 1; }
    .ring-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }

    .capture {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 13px;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: #b9c3ce;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      text-align: start;
    }
    .capture-plus { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 11px; color: #11150f; background: linear-gradient(145deg, var(--gold), var(--mint)); font-size: 19px; font-weight: 500; }
    .capture-copy { flex: 1; font-size: 12px; }
    .capture-kbd { color: var(--soft); font-size: 17px; }

    .section { margin-top: 28px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 3px 13px; }
    .section-title p { margin-top: 4px; color: var(--soft); font-size: 10px; }
    .text-button { padding: 5px 0; border: 0; color: var(--mint); background: none; cursor: pointer; font-size: 11px; }

    .horizontal-list {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(152px, 43%);
      gap: 10px;
      overflow-x: auto;
      margin-inline: -16px;
      padding: 1px 16px 8px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .horizontal-list::-webkit-scrollbar { display: none; }
    .focus-card {
      min-height: 156px;
      padding: 16px;
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.02));
      cursor: pointer;
    }
    .focus-card[data-tone="mint"] { background: linear-gradient(160deg, rgba(44,130,105,.23), rgba(16,37,34,.36)); }
    .focus-card[data-tone="violet"] { background: linear-gradient(160deg, rgba(104,85,175,.24), rgba(29,25,53,.4)); }
    .focus-card[data-tone="gold"] { background: linear-gradient(160deg, rgba(136,104,45,.25), rgba(43,34,20,.4)); }
    .focus-card[data-tone="blue"] { background: linear-gradient(160deg, rgba(46,91,142,.24), rgba(21,36,53,.4)); }
    .focus-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .focus-icon, .module-icon, .type-icon {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      font-size: 17px;
    }
    .focus-card .percent { color: #d8e3e9; font-size: 10px; }
    .focus-card h3 { margin-top: 17px; min-height: 38px; line-height: 1.45; }
    .focus-card p { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .progress { height: 5px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
    .progress > span { display: block; width: var(--progress, 0%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--mint)); }

    .timeline { display: grid; gap: 9px; }
    .timeline-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.028);
    }
    .time { color: var(--soft); font-size: 10px; direction: ltr; text-align: right; }
    .timeline-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .timeline-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--mint); box-shadow: 0 0 16px currentColor; }
    .timeline-dot.gold { background: var(--gold); }
    .timeline-dot.violet { background: var(--violet); }
    .timeline-dot.rose { background: var(--rose); }
    .timeline-copy strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .timeline-copy span { display: block; margin-top: 3px; color: var(--soft); font-size: 9px; }
    .status-pill { padding: 5px 7px; border-radius: 999px; color: var(--mint); background: rgba(99,219,181,.09); font-size: 8px; white-space: nowrap; }

    .module-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .module {
      min-width: 0;
      padding: 13px 5px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.028);
      cursor: pointer;
      text-align: center;
    }
    .module-icon { width: 37px; height: 37px; margin: auto; background: var(--icon-bg, rgba(255,255,255,.06)); color: var(--icon-color, var(--text)); }
    .module strong { display: block; margin-top: 8px; overflow: hidden; font-size: 9px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }

    .money-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border: 1px solid rgba(233,201,124,.13);
      border-radius: 23px;
      background: linear-gradient(145deg, rgba(76,58,28,.42), rgba(20,24,27,.78));
    }
    .money-card h3 { margin-top: 5px; font-size: 23px; direction: ltr; text-align: right; }
    .money-card h3 small { color: var(--muted); font-size: 10px; font-weight: 500; }
    .money-meta { display: flex; gap: 11px; margin-top: 9px; color: var(--muted); font-size: 9px; }
    .spark { display: flex; align-items: end; gap: 4px; width: 78px; height: 48px; direction: ltr; }
    .spark i { width: 7px; height: var(--h); border-radius: 5px; background: linear-gradient(180deg, var(--gold), rgba(233,201,124,.16)); }

    .memory-card {
      position: relative;
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      min-height: 110px;
      padding: 11px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.028);
      cursor: pointer;
    }
    .memory-visual {
      display: grid;
      place-items: center;
      border-radius: 18px;
      background:
        linear-gradient(35deg, rgba(255,205,126,.18), transparent),
        radial-gradient(circle at 35% 25%, #61766f, #24363d 40%, #18212b 72%);
      color: rgba(255,255,255,.9);
      font-size: 24px;
    }
    .memory-copy { align-self: center; }
    .memory-copy h3 { margin-top: 6px; }
    .memory-copy p { margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.65; }

    .page-head { padding: 16px 3px 8px; }
    .page-head-row { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .page-head p { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .soft-button, .primary-button, .ghost-button {
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 720;
    }
    .soft-button { padding: 10px 12px; color: var(--mint); background: rgba(99,219,181,.09); font-size: 10px; }
    .primary-button { padding: 12px 16px; color: #0a1512; background: linear-gradient(135deg, var(--gold), var(--mint)); box-shadow: 0 10px 28px rgba(99,219,181,.14); font-size: 11px; }
    .ghost-button { padding: 11px 14px; border: 1px solid var(--line); color: #d8e0e7; background: rgba(255,255,255,.035); font-size: 10px; }

    .summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 15px; }
    .summary-box { padding: 14px 9px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.03); text-align: center; }
    .summary-box strong { display: block; font-size: 19px; }
    .summary-box span { display: block; margin-top: 4px; color: var(--soft); font-size: 9px; }

    .goal-list { display: grid; gap: 11px; }
    .goal-card { padding: 17px; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.018)); }
    .goal-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .goal-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .goal-title .module-icon { margin: 0; flex: 0 0 auto; }
    .goal-title strong { display: block; font-size: 13px; }
    .goal-title span { display: block; margin-top: 3px; color: var(--soft); font-size: 9px; }
    .goal-percent { color: var(--mint); font-size: 12px; font-weight: 750; }
    .goal-next { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
    .goal-next span { color: var(--muted); font-size: 10px; }
    .mini-action { padding: 7px 9px; border: 0; border-radius: 10px; color: var(--mint); background: rgba(99,219,181,.08); cursor: pointer; font-size: 9px; }

    .task-list { display: grid; gap: 8px; }
    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255,255,255,.025);
    }
    .check {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }
    .check.done { border-color: rgba(99,219,181,.35); color: #07100d; background: var(--mint); }
    .task-copy strong { display: block; font-size: 11px; }
    .task-copy span { display: block; margin-top: 3px; color: var(--soft); font-size: 8px; }
    .task.done .task-copy strong { color: var(--soft); text-decoration: line-through; }
    .task-tag { padding: 5px 7px; border-radius: 999px; color: var(--violet); background: rgba(182,164,255,.09); font-size: 8px; }

    .library-hero {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 16px;
      min-height: 150px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background:
        radial-gradient(circle at 100% 0, rgba(182,164,255,.19), transparent 50%),
        linear-gradient(145deg, #171827, #101820);
    }
    .cover {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 118px;
      overflow: hidden;
      border-radius: 16px 10px 10px 16px;
      background: var(--cover, linear-gradient(145deg, #6d5aa8, #2d264d));
      box-shadow: -8px 12px 28px rgba(0,0,0,.28), inset 5px 0 0 rgba(255,255,255,.09);
      color: rgba(255,255,255,.86);
      text-align: center;
    }
    .cover::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,.13); border-radius: 10px 6px 6px 10px; }
    .cover span { position: relative; z-index: 1; padding: 8px; font-size: 10px; font-weight: 750; line-height: 1.5; }
    .library-hero-copy { align-self: center; }
    .library-hero-copy .kind { color: var(--violet); font-size: 9px; }
    .library-hero-copy h2 { margin-top: 5px; }
    .library-hero-copy p { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .library-actions { display: flex; align-items: center; gap: 8px; margin-top: 13px; }

    .filters { display: flex; gap: 7px; overflow-x: auto; margin-inline: -16px; padding: 15px 16px 8px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.025); cursor: pointer; font-size: 9px; }
    .filter.active { border-color: rgba(99,219,181,.2); color: var(--mint); background: rgba(99,219,181,.09); }

    .media-list { display: grid; gap: 9px; }
    .media-item {
      display: grid;
      grid-template-columns: 50px 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.026);
    }
    .media-thumb { display: grid; place-items: center; width: 50px; height: 57px; border-radius: 13px; background: var(--thumb, var(--violet-deep)); font-size: 19px; }
    .media-copy strong { display: block; font-size: 11px; }
    .media-copy span { display: block; margin-top: 4px; color: var(--soft); font-size: 8px; }
    .media-copy .progress { margin-top: 8px; }
    .continue-button { width: 31px; height: 31px; padding: 0; border: 0; border-radius: 50%; color: #0b1512; background: var(--mint); cursor: pointer; font-size: 11px; }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 17px;
      direction: rtl;
    }
    .day {
      padding: 9px 2px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: center;
    }
    .day span { display: block; font-size: 8px; }
    .day strong { display: block; margin-top: 6px; font-size: 13px; }
    .day i { display: block; width: 4px; height: 4px; margin: 6px auto 0; border-radius: 50%; background: transparent; }
    .day.has i { background: var(--gold); }
    .day.active { border-color: rgba(99,219,181,.19); color: var(--text); background: rgba(99,219,181,.095); }
    .day.active i { background: var(--mint); }

    .calendar-card { padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.026); }
    .calendar-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .calendar-link-copy { display: flex; align-items: center; gap: 11px; }
    .calendar-link-copy strong { display: block; font-size: 11px; }
    .calendar-link-copy span { display: block; margin-top: 3px; color: var(--soft); font-size: 8px; }

    .bottom-nav {
      position: fixed;
      z-index: 30;
      inset: auto 50% 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      width: min(100%, 480px);
      min-height: calc(72px + env(safe-area-inset-bottom));
      padding: 7px 10px calc(8px + env(safe-area-inset-bottom));
      transform: translateX(50%);
      border-top: 1px solid var(--line);
      background: rgba(8,13,19,.92);
      backdrop-filter: blur(24px) saturate(150%);
    }
    .nav-button { display: grid; justify-items: center; gap: 4px; padding: 5px 2px; border: 0; color: var(--soft); background: transparent; cursor: pointer; font-size: 9px; }
    .nav-glyph { display: grid; place-items: center; width: 30px; height: 27px; border-radius: 10px; font-size: 17px; line-height: 1; }
    .nav-button.active { color: var(--text); }
    .nav-button.active .nav-glyph { color: var(--mint); background: rgba(99,219,181,.1); }
    .nav-add { position: relative; top: -12px; }
    .nav-add .nav-glyph { width: 51px; height: 51px; border-radius: 19px 19px 19px 7px; color: #0b1411; background: linear-gradient(145deg, var(--gold), var(--mint)); box-shadow: 0 11px 32px rgba(99,219,181,.22); font-size: 29px; font-weight: 350; }

    .sheet-root:empty { display: none; }
    .sheet-backdrop { position: fixed; z-index: 80; inset: 0; display: grid; align-items: end; background: rgba(0,0,0,.58); backdrop-filter: blur(8px); animation: fadeIn .2s ease both; }
    .sheet {
      width: min(100%, 480px);
      max-height: 88dvh;
      margin-inline: auto;
      padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
      overflow-y: auto;
      border: 1px solid var(--line-strong);
      border-bottom: 0;
      border-radius: 30px 30px 0 0;
      background: #101821;
      box-shadow: 0 -24px 70px rgba(0,0,0,.5);
      animation: sheetIn .28s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes sheetIn { from { transform: translateY(28px); opacity: .6; } }
    .sheet-handle { width: 42px; height: 4px; margin: 0 auto 17px; border-radius: 999px; background: rgba(255,255,255,.15); }
    .sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .sheet-head p { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .close { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: rgba(255,255,255,.03); cursor: pointer; }

    .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .type-button { min-height: 90px; padding: 13px 6px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.03); cursor: pointer; text-align: center; }
    .type-icon { margin: auto; }
    .type-button strong { display: block; margin-top: 8px; font-size: 10px; }
    .type-button span { display: block; margin-top: 2px; color: var(--soft); font-size: 7px; }

    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 10px; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.035);
      appearance: none;
    }
    .field textarea { min-height: 105px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #667482; }
    .form-actions { display: flex; gap: 9px; margin-top: 5px; }
    .form-actions > * { flex: 1; }

    .detail-hero { padding: 19px; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(145deg, rgba(99,219,181,.1), rgba(182,164,255,.07)); }
    .detail-hero-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .detail-big { margin-top: 6px; font-size: 28px; font-weight: 800; }
    .detail-big small { color: var(--muted); font-size: 10px; font-weight: 500; }
    .detail-list { display: grid; gap: 8px; margin-top: 16px; }
    .detail-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.025); }
    .detail-row strong { display: block; font-size: 10px; }
    .detail-row span { display: block; margin-top: 3px; color: var(--soft); font-size: 8px; }
    .detail-value { color: var(--mint); font-size: 10px; white-space: nowrap; }

    .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 95px; gap: 7px; }
    .memory-tile { display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--memory-bg, linear-gradient(145deg, #3c5360, #1d2c34)); font-size: 20px; }
    .memory-tile:first-child { grid-column: span 2; grid-row: span 2; }

    .note-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .note { min-height: 120px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--note-bg, rgba(255,255,255,.03)); }
    .note strong { display: block; font-size: 11px; }
    .note p { margin-top: 7px; color: var(--muted); font-size: 9px; line-height: 1.65; }

    .toast {
      position: fixed;
      z-index: 120;
      inset: auto 50% calc(90px + env(safe-area-inset-bottom)) auto;
      width: min(calc(100% - 36px), 420px);
      padding: 12px 14px;
      transform: translate(50%, 20px);
      border: 1px solid rgba(99,219,181,.2);
      border-radius: 15px;
      color: #dff9f0;
      background: rgba(18,48,40,.95);
      box-shadow: 0 15px 44px rgba(0,0,0,.35);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      font-size: 10px;
      text-align: center;
    }
    .toast.show { transform: translate(50%, 0); opacity: 1; }

    .empty { padding: 28px 18px; border: 1px dashed var(--line-strong); border-radius: 20px; color: var(--muted); text-align: center; font-size: 11px; }

    @media (min-width: 700px) {
      body { padding-block: 24px; }
      .app { min-height: calc(100dvh - 48px); border-radius: 34px; }
      .bottom-nav { bottom: 24px; border-radius: 0 0 34px 34px; }
      .sheet-backdrop { align-items: center; }
      .sheet { max-height: 82dvh; border-bottom: 1px solid var(--line-strong); border-radius: 30px; }
    }

    @media (max-width: 360px) {
      .balance-card { grid-template-columns: 1fr; }
      .ring { width: 91px; height: 91px; position: absolute; inset: 20px auto auto 18px; opacity: .88; }
      .ring::before { width: 70px; height: 70px; }
      .ring-copy strong { font-size: 21px; }
      .balance-copy { max-width: 70%; }
      .module-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <button class="round-button" type="button" data-action="profile" aria-label="فتح الملف الشخصي">ع</button>
      <div class="brand" aria-label="حياتك">
        <span class="brand-mark">ح</span>
        <span class="brand-copy"><strong>حياتك</strong><span>كل ما يهمك، في مكان واحد</span></span>
      </div>
      <button class="round-button" type="button" data-action="notifications" aria-label="فتح التنبيهات">♢<span class="unread"></span></button>
    </header>

    <main id="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button" type="button" data-route="today"><span class="nav-glyph">⌂</span><span>اليوم</span></button>
      <button class="nav-button" type="button" data-route="plan"><span class="nav-glyph">◎</span><span>خطتي</span></button>
      <button class="nav-button nav-add" type="button" data-action="quick-add" aria-label="إضافة"><span class="nav-glyph">＋</span><span>أضف</span></button>
      <button class="nav-button" type="button" data-route="calendar"><span class="nav-glyph">□</span><span>التقويم</span></button>
      <button class="nav-button" type="button" data-route="library"><span class="nav-glyph">▤</span><span>مكتبتي</span></button>
    </nav>
  </div>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="filePicker" type="file" hidden multiple accept="image/*,video/*,audio/*,.pdf,.epub,.mobi">

  <script>
    (() => {
      const STORAGE_KEY = "hayatuk-preview-v2";
      const seed = {
        profile: { name: "عبدالرحمن", streak: 12 },
        quran: { todayDone: 8, todayTarget: 12, khatmaProgress: 37, current: "آل عمران", nextPage: 64, reminder: "بعد الفجر" },
        finance: { dailySpent: 128, dailyBudget: 220, monthSpent: 3670, monthBudget: 5200 },
        goals: [
          { id: "g1", icon: "✦", title: "الاستعداد لاختبار CFA", area: "تطوير مهني", progress: 64, next: "جلسة مذاكرة 45 دقيقة" },
          { id: "g2", icon: "◌", title: "ختم القرآن بانتظام", area: "روحاني", progress: 37, next: "إكمال 4 صفحات اليوم" },
          { id: "g3", icon: "↗", title: "ضبط المصروف الشهري", area: "مالي", progress: 71, next: "مراجعة اشتراكات هذا الأسبوع" }
        ],
        tasks: [
          { id: "t1", title: "مراجعة القراءة الثالثة", meta: "CFA · قبل 8:00 م", tag: "هدف", done: false },
          { id: "t2", title: "تسجيل مصروفات اليوم", meta: "المال · دقيقتان", tag: "روتين", done: true },
          { id: "t3", title: "الاتصال بالوالدة", meta: "شخصي · 9:00 م", tag: "موعد", done: false }
        ],
        reminders: [
          { id: "r1", time: "05:10", title: "ورد القرآن", meta: "12 صفحة · مرتبط بهدف الختمة", tone: "mint", status: "متكرر" },
          { id: "r2", time: "18:30", title: "جلسة مذاكرة CFA", meta: "45 دقيقة · الهدف المهني", tone: "violet", status: "اليوم" },
          { id: "r3", time: "20:00", title: "سداد فاتورة الإنترنت", meta: "متوقع 287 ر.س · الميزانية", tone: "gold", status: "مالي" },
          { id: "r4", time: "21:15", title: "إغلاق اليوم وكتابة سطر", meta: "مذكرة + صورة إن وجدت", tone: "rose", status: "يومي" }
        ],
        library: [
          { id: "l1", type: "book", icon: "ب", title: "العادات الذرية", author: "جيمس كلير", progress: 42, detail: "صفحة 136 من 320", cover: "linear-gradient(145deg,#725e3c,#2f281e)" },
          { id: "l2", type: "course", icon: "▶", title: "مراجعة التحليل المالي", author: "دورة · 18 درسًا", progress: 61, detail: "الدرس 11 من 18", cover: "linear-gradient(145deg,#355a79,#172b3d)" },
          { id: "l3", type: "audio", icon: "♫", title: "فن التركيز والإنجاز", author: "كتاب صوتي · 6 س 20 د", progress: 28, detail: "1 س 46 د مستمع", cover: "linear-gradient(145deg,#64528c,#2c2542)" },
          { id: "l4", type: "video", icon: "◉", title: "محاضرة: إدارة الطاقة", author: "فيديو · 54 دقيقة", progress: 73, detail: "39 دقيقة مشاهدة", cover: "linear-gradient(145deg,#397367,#1b3833)" },
          { id: "l5", type: "movie", icon: "▣", title: "فيلم محفوظ للمشاهدة", author: "فيلم · ساعتان", progress: 12, detail: "14 دقيقة مشاهدة", cover: "linear-gradient(145deg,#7a4751,#352127)" }
        ],
        notes: [
          { id: "n1", title: "فكرة اليوم", body: "التقدم الذي أراه أهم من الخطة المثالية التي لا أبدأها.", tone: "rgba(99,219,181,.07)" },
          { id: "n2", title: "قائمة سريعة", body: "تحديث الوثائق، حجز الموعد، مراجعة مصروف السيارة.", tone: "rgba(233,201,124,.07)" },
          { id: "n3", title: "من كتاب", body: "اجعل البيئة تساعدك على العادة بدل الاعتماد على الإرادة وحدها.", tone: "rgba(182,164,255,.07)" }
        ],
        memories: [
          { id: "m1", title: "رحلة شتوية", body: "قبل 4 سنوات · 7 صور وفيديو", icon: "◫" },
          { id: "m2", title: "يوم هادئ", body: "مذكرة صوتية · دقيقتان", icon: "♫" }
        ],
        selectedDay: 0
      };

      const clone = (value) => JSON.parse(JSON.stringify(value));
      const loadState = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return stored && stored.profile ? { ...clone(seed), ...stored } : clone(seed);
        } catch { return clone(seed); }
      };

      let state = loadState();
      let route = "today";
      let libraryFilter = "all";
      let toastTimer;

      const screen = document.getElementById("screen");
      const sheetRoot = document.getElementById("sheetRoot");
      const toastEl = document.getElementById("toast");
      const filePicker = document.getElementById("filePicker");

      const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const clamp = (value, min = 0, max = 100) => Math.min(max, Math.max(min, Number(value) || 0));
      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const money = (value) => new Intl.NumberFormat("ar-SA-u-nu-latn", { maximumFractionDigits: 0 }).format(value);
      const formatDay = (date = new Date()) => new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { weekday: "long", day: "numeric", month: "long" }).format(date);
      const greeting = () => { const h = new Date().getHours(); return h < 12 ? "صباح الخير" : h < 18 ? "مساء النشاط" : "مساء الخير"; };
      const doneTasks = () => state.tasks.filter((task) => task.done).length;
      const dailyScore = () => Math.round((clamp(state.quran.todayDone / state.quran.todayTarget * 100) + (state.tasks.length ? doneTasks() / state.tasks.length * 100 : 100) + 68) / 3);
      const toneDot = (tone) => tone === "gold" ? "gold" : tone === "violet" ? "violet" : tone === "rose" ? "rose" : "";
      const typeLabels = { all: "الكل", book: "كتب", audio: "صوتي", video: "فيديو", course: "دورات", movie: "أفلام" };

      const toast = (message) => {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add("show");
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
      };

      const progressBar = (value) => `<div class="progress" aria-label="نسبة الإنجاز ${clamp(value)}%"><span style="--progress:${clamp(value)}%"></span></div>`;
      const ring = (value, label, color = "var(--mint)") => `<div class="ring" style="--value:${clamp(value)};--ring-color:${color}" role="img" aria-label="${esc(label)} ${clamp(value)} بالمئة"><div class="ring-copy"><strong>${clamp(value)}%</strong><span>${esc(label)}</span></div></div>`;

      function renderToday() {
        const score = dailyScore();
        const quranPercent = clamp(state.quran.todayDone / state.quran.todayTarget * 100);
        const taskPercent = state.tasks.length ? clamp(doneTasks() / state.tasks.length * 100) : 100;
        return `
          <section class="screen">
            <div class="hero-head">
              <div><p class="eyebrow">${esc(greeting())}</p><h1>${esc(state.profile.name)}، هذه حياتك</h1><p class="date-line">${esc(formatDay())}</p></div>
              <div class="streak"><span>♨</span><span>${state.profile.streak} يوم اتزان</span></div>
            </div>

            <article class="balance-card">
              <div class="balance-copy">
                <span class="label">اتزان يومك</span>
                <h2>${score >= 75 ? "أنت على مسار جميل" : "خطوتان وتصير أقرب"}</h2>
                <p>كل إنجاز صغير يحرّك أهدافك ووردك وتعلّمك في لوحة واحدة.</p>
                <div class="balance-details"><span class="micro-chip">${doneTasks()}/${state.tasks.length} مهام</span><span class="micro-chip">${state.quran.todayDone}/${state.quran.todayTarget} صفحات</span><span class="micro-chip">${money(state.finance.dailySpent)} ر.س اليوم</span></div>
              </div>
              ${ring(score, "مكتمل")}
            </article>

            <button class="capture" type="button" data-action="quick-add"><span class="capture-plus">＋</span><span class="capture-copy">اكتب أي شيء… مهمة، فكرة، مصروف أو ذكرى</span><span class="capture-kbd">⌁</span></button>

            <section class="section">
              <div class="section-head"><div class="section-title"><h2>خطتك الآن</h2><p>اختيارات ذكية تكمل يومك</p></div><button class="text-button" type="button" data-route="plan">عرض الخطة</button></div>
              <div class="horizontal-list">
                <article class="focus-card" data-tone="mint" data-module="quran"><div class="focus-top"><span class="focus-icon">۞</span><span class="percent">${Math.round(quranPercent)}%</span></div><h3>ورد القرآن</h3><p>باقي ${Math.max(0, state.quran.todayTarget - state.quran.todayDone)} صفحات</p>${progressBar(quranPercent)}</article>
                <article class="focus-card" data-tone="violet" data-action="library-progress" data-id="l1"><div class="focus-top"><span class="focus-icon">ب</span><span class="percent">${state.library[0]?.progress ?? 0}%</span></div><h3>${esc(state.library[0]?.title || "كتابك الحالي")}</h3><p>${esc(state.library[0]?.detail || "ابدأ القراءة")}</p>${progressBar(state.library[0]?.progress ?? 0)}</article>
                <article class="focus-card" data-tone="gold" data-module="finance"><div class="focus-top"><span class="focus-icon">ر.س</span><span class="percent">${Math.round(clamp(state.finance.dailySpent / state.finance.dailyBudget * 100))}%</span></div><h3>ميزانية اليوم</h3><p>متاح ${money(Math.max(0, state.finance.dailyBudget - state.finance.dailySpent))} ر.س</p>${progressBar(clamp(state.finance.dailySpent / state.finance.dailyBudget * 100))}</article>
                <article class="focus-card" data-tone="blue" data-route="plan"><div class="focus-top"><span class="focus-icon">✓</span><span class="percent">${Math.round(taskPercent)}%</span></div><h3>المهام المهمة</h3><p>${state.tasks.length - doneTasks()} مهام متبقية</p>${progressBar(taskPercent)}</article>
              </div>
            </section>

            <section class="section">
              <div class="section-head"><div class="section-title"><h2>القادم في يومك</h2><p>التذكيرات مرتبطة بخطتك وتقويمك</p></div><button class="text-button" type="button" data-route="calendar">التقويم</button></div>
              <div class="timeline">
                ${state.reminders.slice(0, 3).map((item) => `<article class="timeline-item"><span class="time">${esc(item.time)}</span><div class="timeline-main"><i class="timeline-dot ${toneDot(item.tone)}"></i><div class="timeline-copy"><strong>${esc(item.title)}</strong><span>${esc(item.meta)}</span></div></div><span class="status-pill">${esc(item.status)}</span></article>`).join("")}
              </div>
            </section>

            <section class="section">
              <div class="section-head"><div class="section-title"><h2>كل حياتك</h2><p>وحدات مترابطة وليست تطبيقات منفصلة</p></div></div>
              <div class="module-grid">
                ${[
                  ["tasks","✓","المهام","rgba(131,184,255,.1)","var(--blue)"],
                  ["notes","✎","الملاحظات","rgba(233,201,124,.1)","var(--gold)"],
                  ["memories","◫","الذكريات","rgba(255,157,168,.1)","var(--rose)"],
                  ["quran","۞","الورد","rgba(99,219,181,.1)","var(--mint)"],
                  ["finance","ر.س","الميزانية","rgba(233,201,124,.1)","var(--gold)"],
                  ["growth","↗","تطويري","rgba(182,164,255,.1)","var(--violet)"],
                  ["library","▤","مكتبتي","rgba(131,184,255,.1)","var(--blue)"],
                  ["calendar","□","التقويم","rgba(99,219,181,.1)","var(--mint)"]
                ].map(([key,icon,label,bg,color]) => `<button class="module" type="button" ${key === "library" || key === "calendar" ? `data-route="${key}"` : `data-module="${key}"`}><span class="module-icon" style="--icon-bg:${bg};--icon-color:${color}">${icon}</span><strong>${label}</strong></button>`).join("")}
              </div>
            </section>

            <section class="section">
              <div class="section-head"><div class="section-title"><h2>ميزانيتك بهدوء</h2><p>المصروف، الفواتير والأهداف المالية</p></div><button class="text-button" type="button" data-module="finance">التفاصيل</button></div>

            <section class="section">

              <article class="memory-card" data-module="memories"><div class="memory-visual">◫</div><div class="memory-copy"><span class="tiny">قبل 4 سنوات</span><h3>رحلة شتوية لا تُنسى</h3><p>7 صور، مقطع فيديو ومذكرة قصيرة محفوظة معًا.</p></div></article>
            </section>
          </section>`;
      }

      function renderPlan() {
        const average = Math.round(state.goals.reduce((sum, goal) => sum + goal.progress, 0) / Math.max(1, state.goals.length));
        return `
          <section class="screen">
            <header class="page-head"><div class="page-head-row"><div><p class="eyebrow">من الوجهة إلى الخطوة</p><h1>خطتي</h1><p>أهدافك تتحول تلقائيًا إلى خطوات في يومك وتقويمك.</p></div><button class="soft-button" type="button" data-compose="goal">＋ هدف</button></div>
              <div class="summary-strip"><div class="summary-box"><strong>${average}%</strong><span>تقدم الأهداف</span></div><div class="summary-box"><strong>${doneTasks()}/${state.tasks.length}</strong><span>مهام اليوم</span></div><div class="summary-box"><strong>${state.profile.streak}</strong><span>سلسلة الاتزان</span></div></div>
            </header>

            <section class="section"><div class="section-head"><div class="section-title"><h2>أهدافي النشطة</h2><p>كل هدف له خطوة تالية واضحة</p></div></div><div class="goal-list">
              ${state.goals.map((goal) => `<article class="goal-card"><div class="goal-top"><div class="goal-title"><span class="module-icon" style="--icon-bg:rgba(182,164,255,.09);--icon-color:var(--violet)">${esc(goal.icon)}</span><div><strong>${esc(goal.title)}</strong><span>${esc(goal.area)}</span></div></div><span class="goal-percent">${clamp(goal.progress)}%</span></div>${progressBar(goal.progress)}<div class="goal-next"><span>الخطوة التالية: ${esc(goal.next)}</span><button class="mini-action" type="button" data-action="goal-step" data-id="${esc(goal.id)}">أنجزت</button></div></article>`).join("")}
            </div></section>

            <section class="section"><div class="section-head"><div class="section-title"><h2>مهام اليوم</h2><p>مرتبة بحسب ارتباطها بأهدافك</p></div><button class="text-button" type="button" data-compose="task">＋ مهمة</button></div><div class="task-list">
              ${state.tasks.map((task) => `<article class="task ${task.done ? "done" : ""}"><button class="check ${task.done ? "done" : ""}" type="button" data-action="toggle-task" data-id="${esc(task.id)}" aria-label="${task.done ? "إلغاء إكمال" : "إكمال"} ${esc(task.title)}">${task.done ? "✓" : ""}</button><div class="task-copy"><strong>${esc(task.title)}</strong><span>${esc(task.meta)}</span></div><span class="task-tag">${esc(task.tag)}</span></article>`).join("")}
            </div></section>

            <section class="section"><article class="calendar-card"><div class="calendar-link"><div class="calendar-link-copy"><span class="module-icon" style="--icon-bg:rgba(99,219,181,.09);--icon-color:var(--mint)">□</span><div><strong>مراجعة أسبوعية كل جمعة</strong><span>حياتك يلخّص إنجازك ويقترح أسبوعك القادم</span></div></div><button class="soft-button" type="button" data-action="review">ابدأ</button></div></article></section>
          </section>`;
      }

      function renderLibrary() {
        const items = state.library.filter((item) => libraryFilter === "all" || item.type === libraryFilter);
        const current = state.library[0];
        return `
          <section class="screen">
            <header class="page-head"><div class="page-head-row"><div><p class="eyebrow">تعلّم، شاهد، استمع</p><h1>مكتبتي</h1><p>كتبك وصوتياتك وفيديوهاتك ودوراتك مع نسبة إنجاز واحدة.</p></div><button class="soft-button" type="button" data-action="pick-files">＋ إضافة</button></div></header>
            ${current ? `<article class="library-hero"><div class="cover" style="--cover:${esc(current.cover)}"><span>${esc(current.title)}</span></div><div class="library-hero-copy"><span class="kind">تتابع الآن · ${esc(typeLabels[current.type] || current.type)}</span><h2>${esc(current.title)}</h2><p>${esc(current.detail)}</p>${progressBar(current.progress)}<div class="library-actions"><button class="primary-button" type="button" data-action="library-progress" data-id="${esc(current.id)}">متابعة</button><button class="ghost-button" type="button" data-action="library-details" data-id="${esc(current.id)}">التفاصيل</button></div></div></article>` : ""}
            <div class="filters">${Object.entries(typeLabels).map(([key, label]) => `<button class="filter ${libraryFilter === key ? "active" : ""}" type="button" data-filter="${key}">${label}</button>`).join("")}</div>
            <section class="section" style="margin-top:12px"><div class="section-head"><div class="section-title"><h2>${libraryFilter === "all" ? "كل المواد" : typeLabels[libraryFilter]}</h2><p>${items.length} عناصر محفوظة</p></div></div><div class="media-list">
              ${items.length ? items.map((item) => `<article class="media-item"><div class="media-thumb" style="--thumb:${esc(item.cover)}">${esc(item.icon)}</div><div class="media-copy"><strong>${esc(item.title)}</strong><span>${esc(item.author)} · ${esc(item.detail)}</span>${progressBar(item.progress)}</div><button class="continue-button" type="button" data-action="library-progress" data-id="${esc(item.id)}" aria-label="زيادة تقدم ${esc(item.title)}">▶</button></article>`).join("") : `<div class="empty">لا توجد مواد في هذا القسم بعد. أضف كتابًا أو ملفًا من جهازك.</div>`}
            </div></section>
            <section class="section"><article class="calendar-card"><div class="calendar-link"><div class="calendar-link-copy"><span class="module-icon" style="--icon-bg:rgba(131,184,255,.09);--icon-color:var(--blue)">◫</span><div><strong>ملفاتك تبقى لك</strong><span>هذه النسخة تحفظ بطاقة الملف محليًا؛ التخزين الآمن الكامل في مرحلة التطبيق.</span></div></div></div></article></section>
          </section>`;
      }

      function calendarDays() {
        const formatter = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { weekday: "short" });
        return Array.from({ length: 7 }, (_, index) => {
          const date = new Date(); date.setDate(date.getDate() + index);
          return { index, weekday: formatter.format(date).replace("،", ""), day: date.getDate() };
        });
      }

      function renderCalendar() {
        const selectedLabel = state.selectedDay === 0 ? "اليوم" : `بعد ${state.selectedDay} ${state.selectedDay === 1 ? "يوم" : "أيام"}`;
        return `
          <section class="screen">
            <header class="page-head"><div class="page-head-row"><div><p class="eyebrow">كل مواعيد حياتك</p><h1>التقويم</h1><p>مواعيدك وتذكيراتك وفواتيرك ووردك في خط زمني واحد.</p></div><button class="soft-button" type="button" data-compose="reminder">＋ تذكير</button></div>
              <div class="week">${calendarDays().map((day) => `<button class="day ${state.selectedDay === day.index ? "active" : ""} ${day.index < 5 ? "has" : ""}" type="button" data-day="${day.index}"><span>${esc(day.weekday)}</span><strong>${day.day}</strong><i></i></button>`).join("")}</div>
            </header>

            <section class="section" style="margin-top:18px"><div class="section-head"><div class="section-title"><h2>${selectedLabel}</h2><p>${state.selectedDay === 0 ? state.reminders.length : Math.max(1, 3 - state.selectedDay % 3)} مواعيد وتذكيرات</p></div></div><div class="timeline">
              ${(state.selectedDay === 0 ? state.reminders : state.reminders.slice(0, Math.max(1, 3 - state.selectedDay % 3))).map((item) => `<article class="timeline-item"><span class="time">${esc(item.time)}</span><div class="timeline-main"><i class="timeline-dot ${toneDot(item.tone)}"></i><div class="timeline-copy"><strong>${esc(item.title)}</strong><span>${esc(item.meta)}</span></div></div><span class="status-pill">${esc(item.status)}</span></article>`).join("")}
            </div></section>

            <section class="section"><article class="calendar-card"><div class="calendar-link"><div class="calendar-link-copy"><span class="module-icon" style="--icon-bg:rgba(99,219,181,.09);--icon-color:var(--mint)">↔</span><div><strong>تقويم الجهاز والتذكيرات</strong><span>ربط ثنائي الاتجاه مع إذن واضح منك</span></div></div><button class="soft-button" type="button" data-action="connect-calendar">ربط</button></div></article></section>
            <section class="section"><div class="section-head"><div class="section-title"><h2>تذكيرات ذكية</h2><p>مرتبطة بسبب، لا مجرد تنبيه</p></div></div><div class="detail-list"><div class="detail-row"><div><strong>الفاتورة قبل موعدها بيومين</strong><span>مرتبطة بميزانية المنزل</span></div><span class="detail-value">مفعّل</span></div><div class="detail-row"><div><strong>الورد بعد الفجر</strong><span>يتكيّف مع هدف الختمة</span></div><span class="detail-value">يومي</span></div><div class="detail-row"><div><strong>متابعة المادة غير المكتملة</strong><span>إذا مرّ 3 أيام بلا تقدم</span></div><span class="detail-value">ذكي</span></div></div></section>
          </section>`;
      }

      function render() {
        screen.innerHTML = route === "plan" ? renderPlan() : route === "library" ? renderLibrary() : route === "calendar" ? renderCalendar() : renderToday();
        document.querySelectorAll("[data-route]").forEach((button) => button.classList.toggle("active", button.dataset.route === route));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function sheetFrame(title, subtitle, body) {
        return `<div class="sheet-backdrop" data-action="close-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-handle"></div><header class="sheet-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close" type="button" data-action="close-sheet" aria-label="إغلاق">×</button></header>${body}</section></div>`;
      }

      function openQuickAdd() {
        const types = [
          ["task","✓","مهمة","مرتبطة بهدف"], ["reminder","□","تذكير","مع التقويم"], ["note","✎","ملاحظة","فكرة سريعة"],
          ["expense","ر.س","مصروف","ضمن الميزانية"], ["memory","◫","ذكرى","صورة أو فيديو"], ["library","▤","مادة","كتاب أو دورة"]
        ];
        sheetRoot.innerHTML = sheetFrame("أضف إلى حياتك", "التقاط سريع، ثم يرتّبه التطبيق في مكانه", `<div class="type-grid">${types.map(([key, icon, label, hint]) => `<button class="type-button" type="button" data-compose="${key}"><span class="type-icon">${icon}</span><strong>${label}</strong><span>${hint}</span></button>`).join("")}</div>`);
      }

      function openComposer(type) {
        const info = {
          task: ["مهمة جديدة", "ما الخطوة الواضحة التي تريد إنجازها؟", "مثال: مراجعة الفصل الرابع"],
          reminder: ["تذكير جديد", "سيظهر داخل تقويم حياتك", "مثال: سداد فاتورة الكهرباء"],
          note: ["ملاحظة جديدة", "احفظ الفكرة الآن وصنّفها لاحقًا", "عنوان الملاحظة"],
          expense: ["تسجيل مصروف", "يُخصم مباشرة من ميزانية اليوم", "مثال: قهوة واجتماع"],
          memory: ["حفظ ذكرى", "اجمع النص والصورة والفيديو في لحظة واحدة", "مثال: غروب نهاية الأسبوع"],
          library: ["إضافة مادة", "كتاب أو صوت أو فيديو أو دورة", "اسم المادة"],
          goal: ["هدف جديد", "حدّد نتيجة تستطيع قياسها", "مثال: إنهاء المستوى الثاني" ]
        }[type] || ["إضافة جديدة", "", "العنوان"];
        const goalOptions = state.goals.map((goal) => `<option value="${esc(goal.id)}">${esc(goal.title)}</option>`).join("");
        const extra = type === "expense" ? `<div class="field"><label for="quickAmount">المبلغ (ر.س)</label><input id="quickAmount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>` : "";
        const fileButton = type === "memory" || type === "library" ? `<button class="ghost-button" type="button" data-action="pick-files">اختيار ملف من الجهاز</button>` : "";
        sheetRoot.innerHTML = sheetFrame(info[0], info[1], `<form class="form" id="quickForm" data-type="${esc(type)}"><div class="field"><label for="quickTitle">العنوان</label><input id="quickTitle" name="title" required maxlength="120" placeholder="${esc(info[2])}" autocomplete="off"></div><div class="field"><label for="quickDetails">تفاصيل اختيارية</label><textarea id="quickDetails" name="details" maxlength="500" placeholder="اكتب ما يساعدك عند العودة إليه…"></textarea></div>${extra}<div class="field"><label for="quickDate">الموعد أو التذكير</label><input id="quickDate" name="date" type="datetime-local"></div><div class="field"><label for="quickGoal">مرتبط بـ</label><select id="quickGoal" name="goal"><option value="">بدون ارتباط</option>${goalOptions}</select></div>${fileButton}<div class="form-actions"><button class="primary-button" type="submit">حفظ في حياتك</button><button class="ghost-button" type="button" data-action="close-sheet">إلغاء</button></div></form>`);
        setTimeout(() => document.getElementById("quickTitle")?.focus(), 80);
      }

        if (module === "finance") return sheetFrame("المال والميزانية", "صورة مالية واضحة بلا تعقيد", `<article class="detail-hero"><span class="tiny">المتبقي هذا الشهر</span><div class="detail-big">${money(Math.max(0, state.finance.monthBudget - state.finance.monthSpent))} <small>ر.س</small></div>${progressBar(state.finance.monthSpent / state.finance.monthBudget * 100)}<button class="primary-button" style="width:100%;margin-top:16px" type="button" data-compose="expense">تسجيل مصروف</button></article><div class="detail-list"><div class="detail-row"><div><strong>ميزانية اليوم</strong><span>صرفت ${money(state.finance.dailySpent)} من ${money(state.finance.dailyBudget)}</span></div><span class="detail-value">${money(Math.max(0,state.finance.dailyBudget-state.finance.dailySpent))} متاح</span></div><div class="detail-row"><div><strong>فاتورة الإنترنت</strong><span>بعد يومين · تذكير مفعّل</span></div><span class="detail-value">287 ر.س</span></div><div class="detail-row"><div><strong>اشتراكات متكررة</strong><span>3 اشتراكات هذا الشهر</span></div><span class="detail-value">164 ر.س</span></div></div>`);
        if (module === "memories") return sheetFrame("الذكريات", "صور وفيديو وصوت ومذكرات على خط حياتك", `<div class="memory-grid"><div class="memory-tile" style="--memory-bg:linear-gradient(145deg,#61766f,#24313a)">◫</div><div class="memory-tile" style="--memory-bg:linear-gradient(145deg,#74544c,#30211f)">▶</div><div class="memory-tile" style="--memory-bg:linear-gradient(145deg,#59627d,#24283b)">♫</div><div class="memory-tile" style="--memory-bg:linear-gradient(145deg,#6b7047,#2d3020)">◫</div></div><div class="detail-list">${state.memories.map((item) => `<div class="detail-row"><div><strong>${esc(item.title)}</strong><span>${esc(item.body)}</span></div><span class="detail-value">${esc(item.icon)}</span></div>`).join("")}</div><button class="primary-button" style="width:100%;margin-top:14px" type="button" data-compose="memory">حفظ ذكرى جديدة</button>`);
        if (module === "notes") return sheetFrame("الملاحظات", "دفتر سريع يتحول إلى أفعال وذكريات", `<div class="note-grid">${state.notes.map((note) => `<article class="note" style="--note-bg:${esc(note.tone)}"><strong>${esc(note.title)}</strong><p>${esc(note.body)}</p></article>`).join("")}</div><button class="primary-button" style="width:100%;margin-top:14px" type="button" data-compose="note">ملاحظة جديدة</button>`);
        if (module === "tasks") return sheetFrame("المهام", "خطوات اليوم المرتبطة بأهدافك", `<div class="task-list">${state.tasks.map((task) => `<article class="task ${task.done ? "done" : ""}"><button class="check ${task.done ? "done" : ""}" type="button" data-action="toggle-task" data-id="${esc(task.id)}">${task.done ? "✓" : ""}</button><div class="task-copy"><strong>${esc(task.title)}</strong><span>${esc(task.meta)}</span></div><span class="task-tag">${esc(task.tag)}</span></article>`).join("")}</div><button class="primary-button" style="width:100%;margin-top:14px" type="button" data-compose="task">مهمة جديدة</button>`);
        if (module === "growth") return sheetFrame("تطويري", "قراءة ودورات ومهارات مرتبطة بهدف واضح", `<article class="detail-hero"><span class="tiny">هذا الأسبوع</span><div class="detail-big">4 س 35 د <small>وقت تعلّم مركز</small></div>${progressBar(76)}</article><div class="detail-list"><div class="detail-row"><div><strong>العادات الذرية</strong><span>قراءة · 136 من 320 صفحة</span></div><span class="detail-value">42%</span></div><div class="detail-row"><div><strong>التحليل المالي</strong><span>دورة · 11 من 18 درسًا</span></div><span class="detail-value">61%</span></div><div class="detail-row"><div><strong>التركيز والإنجاز</strong><span>كتاب صوتي</span></div><span class="detail-value">28%</span></div></div><button class="primary-button" style="width:100%;margin-top:14px" type="button" data-route="library">فتح مكتبتي</button>`);
        return sheetFrame("حياتك", "هذه الوحدة ضمن الخطة الكاملة", `<div class="empty">ستظهر تفاصيل هذه الوحدة هنا.</div>`);
      }

        sheetRoot.innerHTML = sheetFrame("ملفي", "إعدادات تجربتك وخصوصيتك", `<article class="detail-hero"><div class="detail-hero-row"><div><span class="tiny">مرحبًا</span><div class="detail-big">${esc(state.profile.name)}</div><p class="tiny" style="margin-top:7px">${state.profile.streak} يوم اتزان متواصل</p></div>${ring(dailyScore(), "اليوم", "var(--gold)")}</div></article><div class="detail-list"><div class="detail-row"><div><strong>الخصوصية والقفل</strong><span>بياناتك محلية في هذا النموذج</span></div><span class="detail-value">محمي</span></div><div class="detail-row"><div><strong>المزامنة والنسخ الاحتياطي</strong><span>تُفعل في النسخة الإنتاجية</span></div><span class="detail-value">قريبًا</span></div><div class="detail-row"><div><strong>المظهر</strong><span>واجهة ليلية هادئة</span></div><span class="detail-value">داكن</span></div></div><button class="ghost-button" style="width:100%;margin-top:14px" type="button" data-action="reset-demo">إعادة بيانات العرض</button>`);

        sheetRoot.innerHTML = sheetFrame("التنبيهات", "ما يحتاج انتباهك فقط", `<div class="detail-list"><div class="detail-row"><div><strong>باقي 4 صفحات من وردك</strong><span>الهدف اليومي · منذ 18 دقيقة</span></div><span class="detail-value">متابعة</span></div><div class="detail-row"><div><strong>فاتورة الإنترنت بعد يومين</strong><span>مجدولة داخل الميزانية</span></div><span class="detail-value">287 ر.س</span></div><div class="detail-row"><div><strong>لم تفتح دورتك منذ 3 أيام</strong><span>خطوة صغيرة تكمل الهدف المهني</span></div><span class="detail-value">11/18</span></div></div>`);

      function handleQuickForm(form) {
        const data = new FormData(form);
        const type = form.dataset.type;
        const title = String(data.get("title") || "").trim();
        const details = String(data.get("details") || "").trim();
        if (!title) return;
        const id = `${type}-${Date.now()}`;
        if (type === "task") state.tasks.unshift({ id, title, meta: details || "مهمة جديدة · بدون موعد", tag: data.get("goal") ? "هدف" : "شخصي", done: false });
        if (type === "reminder") state.reminders.push({ id, time: data.get("date") ? String(data.get("date")).slice(11,16) : "09:00", title, meta: details || "تذكير جديد", tone: "mint", status: data.get("goal") ? "مرتبط" : "جديد" });
        if (type === "note") state.notes.unshift({ id, title, body: details || "ملاحظة محفوظة الآن.", tone: "rgba(131,184,255,.07)" });
        if (type === "expense") { const amount = Math.max(0, Number(data.get("amount")) || 0); state.finance.dailySpent += amount; state.finance.monthSpent += amount; }
        if (type === "memory") state.memories.unshift({ id, title, body: details || "ذكرى جديدة", icon: "◫" });
        if (type === "library") state.library.unshift({ id, type: "book", icon: "▤", title, author: details || "مادة مضافة يدويًا", progress: 0, detail: "لم تبدأ بعد", cover: "linear-gradient(145deg,#3c6170,#1d3039)" });
        if (type === "goal") state.goals.unshift({ id, icon: "◇", title, area: details || "هدف شخصي", progress: 0, next: "حدّد أول خطوة" });
        save(); closeSheet(); render(); toast("تم الحفظ وربطه داخل حياتك");
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("button, [data-module], [data-action]");
        if (!target) return;
        if (target.dataset.route) { route = target.dataset.route; closeSheet(); render(); return; }
        if (target.dataset.module) { sheetRoot.innerHTML = moduleBody(target.dataset.module); return; }
        if (target.dataset.compose) { openComposer(target.dataset.compose); return; }
        if (target.dataset.filter) { libraryFilter = target.dataset.filter; render(); return; }
        if (target.dataset.day !== undefined) { state.selectedDay = Number(target.dataset.day); save(); render(); return; }

        const action = target.dataset.action;
        if (action === "close-sheet" && target.classList.contains("sheet-backdrop") && event.target.closest(".sheet")) return;
        if (action === "quick-add") openQuickAdd();
        if (action === "close-sheet") closeSheet();
        if (action === "profile") openProfile();
        if (action === "notifications") openNotifications();
        if (action === "pick-files") filePicker.click();
        if (action === "connect-calendar") toast("سيطلب التطبيق إذنك عند تفعيل الربط الأصلي — لن يصل لشيء دون موافقتك");
        if (action === "review") toast("مراجعتك: تقدّم جيد في المال والتعلّم، وباقي وردك ومهمتان");
        if (action === "library-details") toast("كل مادة ستحفظ الجلسات، الوقت، الملاحظات ونسبة الإنجاز");
        if (action === "toggle-task") {
          const task = state.tasks.find((item) => item.id === target.dataset.id);
          if (task) { task.done = !task.done; save(); render(); if (sheetRoot.innerHTML) sheetRoot.innerHTML = moduleBody("tasks"); toast(task.done ? "أحسنت، تحرك هدفك خطوة" : "أُعيدت المهمة إلى خطتك"); }
        }
        if (action === "goal-step") {
          const goal = state.goals.find((item) => item.id === target.dataset.id);
          if (goal) { goal.progress = clamp(goal.progress + 5); save(); render(); toast("سُجلت الخطوة وارتفع تقدم الهدف"); }
        }
        if (action === "quran-page") { state.quran.todayDone = Math.min(state.quran.todayTarget, state.quran.todayDone + 1); state.quran.khatmaProgress = clamp(state.quran.khatmaProgress + 1); save(); sheetRoot.innerHTML = moduleBody("quran"); render(); toast("تقبّل الله — سُجلت صفحة"); }
        if (action === "library-progress") {
          const item = state.library.find((entry) => entry.id === target.dataset.id);
          if (item) { item.progress = clamp(item.progress + 5); item.detail = `تقدمك الآن ${item.progress}%`; save(); render(); toast("سُجلت جلسة جديدة في المادة"); }
        }
        if (action === "reset-demo") { state = clone(seed); save(); closeSheet(); render(); toast("عادت بيانات العرض إلى حالتها الأولى"); }
      });

      document.addEventListener("submit", (event) => {
        if (event.target.id !== "quickForm") return;
        event.preventDefault();
        handleQuickForm(event.target);
      });

      filePicker.addEventListener("change", () => {
        const files = Array.from(filePicker.files || []);
        if (!files.length) return;
        files.forEach((file) => {
          const mediaType = file.type.startsWith("audio/") ? "audio" : file.type.startsWith("video/") ? "video" : file.type.startsWith("image/") ? "video" : /pdf|epub|mobi/i.test(file.name) ? "book" : "course";
          state.library.unshift({ id: `file-${Date.now()}-${Math.random()}`, type: mediaType, icon: mediaType === "audio" ? "♫" : mediaType === "video" ? "▶" : "▤", title: file.name.replace(/\.[^.]+$/, ""), author: `ملف من جهازك · ${Math.max(1, Math.round(file.size / 1024 / 1024))} MB`, progress: 0, detail: "جاهز للبدء", cover: "linear-gradient(145deg,#416a70,#203438)" });
        });
        save(); closeSheet(); route = "library"; render(); filePicker.value = ""; toast(`أُضيف ${files.length} ملف إلى مكتبتك في هذا النموذج`);
      });

      window.addEventListener("keydown", (event) => { if (event.key === "Escape") closeSheet(); if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openQuickAdd(); } });
      render();
    })();
  </script>
</body>
</html>
