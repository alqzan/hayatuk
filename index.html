<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#edf3f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="حياتك — مساحة شخصية هادئة تجمع يومك وخطتك ومكتبتك ووردك وميزانيتك وذكرياتك.">
  <link rel="canonical" href="https://alqzan.github.io/hayatuk/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:title" content="حياتك — يومك أوضح">
  <meta property="og:description" content="خطتك ومهامك وتقويمك ومكتبتك ووردك وميزانيتك في مساحة شخصية واحدة.">
  <meta property="og:url" content="https://alqzan.github.io/hayatuk/">
  <meta property="og:image" content="https://alqzan.github.io/hayatuk/og-v3.png">
  <meta property="og:image:width" content="1672">
  <meta property="og:image:height" content="941">
  <meta property="og:image:alt" content="حياتك — مساحتك تبدأ فارغة">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="حياتك — يومك أوضح">
  <meta name="twitter:description" content="مساحة شخصية عربية، بسيطة وجوّال أولًا.">
  <meta name="twitter:image" content="https://alqzan.github.io/hayatuk/og-v3.png">
  <title>حياتك — يومك أوضح</title>
  <script>
    (() => {
      const saved = localStorage.getItem("hayatuk-theme-v1");
      const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>
  <link rel="icon" href="icon.svg?v=1a40753" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=datefix-1">
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-button profile-button" type="button" data-action="profile" aria-label="فتح الملف الشخصي">
        <span id="avatarLetter">ح</span>
      </button>

      <div class="brand" aria-label="حياتك">
        <span class="brand-name">حياتك</span>
        <span class="brand-mark" aria-hidden="true"><i></i></span>
      </div>

      <button class="icon-button" id="themeToggle" type="button" data-action="toggle-theme" aria-label="تفعيل الوضع الليلي">
        <span id="themeIcon" aria-hidden="true">☾</span>
      </button>
    </header>

    <main id="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-button" type="button" data-route="today"><span class="nav-icon">⌂</span><span>اليوم</span></button>
      <button class="nav-button" type="button" data-route="plan"><span class="nav-icon">◎</span><span>خطتي</span></button>
      <button class="nav-button nav-add" type="button" data-action="quick-add" aria-label="إضافة جديدة"><span class="nav-add-icon">＋</span><span>أضف</span></button>
      <button class="nav-button" type="button" data-route="library"><span class="nav-icon">▤</span><span>مكتبتي</span></button>
      <button class="nav-button" type="button" data-route="calendar"><span class="nav-icon">□</span><span>التقويم</span></button>
    </nav>
  </div>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="filePicker" type="file" hidden multiple accept="image/*,video/*,audio/*,.pdf,.epub,.mobi">

  <div id="authView" class="auth-view" aria-hidden="true">
    <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="auth-theme" type="button" data-action="toggle-theme" aria-label="تبديل المظهر"><span aria-hidden="true">☼</span></button>
      <div class="auth-logo" aria-hidden="true"><span>ح</span><i></i></div>
      <p class="auth-kicker">مساحتك الشخصية</p>
      <h1 id="authTitle">أهلًا بك في حياتك</h1>
      <p class="auth-intro">ابدأ باسمك فقط. تحفظ نسخة العرض بياناتك على هذا الجهاز ولا ترسلها لأي خادم.</p>

      <form id="loginForm" class="auth-form">
        <label for="loginName">اسمك</label>
        <input id="loginName" name="name" required maxlength="40" autocomplete="name" placeholder="اكتب اسمك">
        <label for="loginEmail">البريد الإلكتروني <span>اختياري حاليًا</span></label>
        <input id="loginEmail" name="email" type="email" maxlength="100" autocomplete="email" inputmode="email" placeholder="name@example.com" dir="ltr">
        <button class="primary-button auth-submit" type="submit">ادخل إلى حياتك</button>
      </form>

      <p class="auth-note">دخول تجريبي بسيط · بدون كلمة مرور</p>
    </section>
  </div>

  <script src="app.js?v=datefix-1" defer></script>
</body>
</html>
